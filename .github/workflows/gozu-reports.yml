# Test of report mode of Gozu. One job scans the branch and uploads the JSON reports of Trivy and Semgrep.
# The next job gives those reports to Gozu, which makes the Jira tickets and runs no scanner of its own.
name: gozu-reports

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  # Never use pull_request_target. A run on a fork pull request must not get secrets.

concurrency:
  group: gozu-reports-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: true
      # No exit code is set, so findings do not fail the job. Only a scan that breaks does.
      - name: Trivy
        run: |
          trivy fs --format json --scanners vuln,secret,misconfig \
            --skip-dirs .git,node_modules --output trivy-report.json .
      - name: Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet semgrep==1.176.0
          "$RUNNER_TEMP/venv/bin/semgrep" scan --config p/security-audit --metrics off \
            --json --output semgrep-report.json .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-reports
          path: |
            trivy-report.json
            semgrep-report.json
          if-no-files-found: error

  gozu:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      # Gozu reads the flagged lines from this checkout for the code snippet of a ticket.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scan-reports
          path: reports
      - uses: Wasi-cal/Gozu-Action@v1.4.0
        with:
          jira-url: ${{ secrets.JIRA_URL }}
          jira-email: ${{ secrets.JIRA_EMAIL }}
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
          jira-project-key: ${{ secrets.JIRA_PROJECT_KEY }}
          trivy-report: reports/trivy-report.json
          semgrep-report: reports/semgrep-report.json
